<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Math Crossword</title>
  <style>
    :root{--ink:#10224d;--muted:#52678f;--blue:#3978f6;--violet:#7c4dff;--pink:#f45fa6;--gold:#f9b92f;--green:#10b981;--panel:rgba(255,255,255,.94)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#dcecff}button{font:inherit}
    body{min-height:100dvh;background-image:linear-gradient(rgba(235,246,255,.12),rgba(218,232,255,.24)),url("assets/math-lab-background-v2.png");background-size:cover;background-position:center;background-attachment:fixed}
    #app{width:min(100%,460px);min-height:100dvh;margin:auto;padding:14px 14px 36px}.hidden{display:none!important}
    .topbar{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center;margin:2px 0 14px}.round{width:52px;height:52px;border:0;border-radius:50%;background:#fff;color:#1746b7;font-size:29px;font-weight:900;box-shadow:0 6px 15px #25439c2b}.round.close{color:#ef4444}.title-pill{height:52px;border:2px solid #fff;border-radius:27px;color:#fff;font-weight:900;font-size:18px;background:linear-gradient(100deg,var(--violet),var(--blue));box-shadow:0 7px 16px #25439c38}
    .panel{background:var(--panel);border:2px solid #fff;border-radius:28px;box-shadow:0 10px 24px #2a449933}.hero{padding:17px;margin-bottom:16px}.hero-row{display:flex;align-items:center;gap:14px}.icon{width:78px;height:78px;border-radius:22px;background:linear-gradient(145deg,#ffd95b,#ff7a6c);display:grid;place-items:center;font-size:41px;border:4px solid white;box-shadow:0 5px 12px #2b45942e}.eyebrow{color:var(--violet);font-size:11px;letter-spacing:1.1px;font-weight:900}.hero h1{font-size:25px;line-height:1.1;margin:4px 0 5px}.hero p{margin:0;color:var(--muted);font-size:13px;font-weight:700;line-height:1.35}.tip{margin-top:14px;padding:12px;border:1px solid #7c4dff22;border-radius:17px;background:#7c4dff10;color:var(--muted);font-size:13px;font-weight:750}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#ffffffc9;border:1px solid #6366f11f;border-radius:15px;text-align:center;padding:8px 3px}.stat b{display:block;font-size:15px}.stat small{font-size:9px;color:var(--muted);font-weight:750}
    .section-title{display:flex;align-items:center;justify-content:space-between;margin:4px 3px 10px}.section-title h2{margin:0;font-size:20px}.section-title span{color:var(--muted);font-size:12px;font-weight:800}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}.filter{min-height:42px;border-radius:16px;border:1.5px solid #7c4dff33;background:#ffffffdf;color:var(--ink);font-size:11px;font-weight:900}.filter.active{background:var(--violet);color:#fff;border-color:#fff;box-shadow:0 4px 9px #7c4dff44}
    .level{width:100%;min-height:108px;margin:0 0 13px;padding:11px;border-radius:24px;border:2px solid #10b98144;background:#fff;display:grid;grid-template-columns:72px 1fr 47px;gap:12px;align-items:center;text-align:left;box-shadow:0 5px 13px #33415522}.level:active{transform:scale(.985)}.badge{height:84px;border-radius:18px;background:linear-gradient(145deg,#65e2b3,#10b981);color:#fff;display:grid;place-content:center;text-align:center}.badge.medium{background:linear-gradient(145deg,#93c5fd,#3978f6)}.badge.hard{background:linear-gradient(145deg,#f9a8d4,#ec4899)}.badge i{font-style:normal;font-size:25px}.badge b{font-size:10px;margin-top:4px}.level h3{font-size:18px;margin:0 0 7px}.preview{display:flex;gap:3px}.preview i{font-style:normal;min-width:18px;height:18px;border:1px solid #10b98133;border-radius:5px;background:#10b98110;color:#087a55;font-size:10px;font-weight:900;display:grid;place-items:center}.preview i.blank{background:#fff5c5;border-color:#f59e0b;color:#b45309}.meta{margin-top:7px;color:var(--muted);font-size:11px;font-weight:800}.play-circle{width:38px;height:38px;border:0;border-radius:50%;background:var(--green);color:white;font-size:18px}.play-label{text-align:center;color:var(--green);font-size:9px;font-weight:900;margin-top:4px}
    .game-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.game-stat{min-height:42px;border:1.5px solid #7c4dff2e;border-radius:15px;background:#ffffffe8;display:grid;place-items:center;font-size:11px;font-weight:900;text-align:center}.clue{padding:12px 14px;margin-bottom:14px;text-align:center}.clue small{display:block;color:var(--violet);font-weight:900;letter-spacing:.8px;margin-bottom:4px}.clue strong{font-size:15px;color:var(--muted)}
    .board-wrap{padding:16px;overflow:auto;margin-bottom:16px}.board{display:grid;gap:6px;width:max-content;min-width:100%;justify-content:center}.cell{width:52px;height:52px;border:2px solid #7c91be44;border-radius:13px;background:#bfd8fa;color:var(--ink);display:grid;place-items:center;font-size:25px;font-weight:900}.cell.blank{background:#fff8bc;border-color:#f9b92f}.cell.selected{border:3px solid var(--violet);background:#fde68a;box-shadow:0 4px 10px #7c4dff44}.cell.good{background:#bbf7d0;border-color:#22c55e}.cell.bad{background:#fecaca;border-color:#ef4444}.cell.empty{visibility:hidden}
    .keypad{padding:12px}.keypad-title{text-align:center;color:var(--muted);font-size:12px;font-weight:900;letter-spacing:.6px;margin-bottom:10px}.keys{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.key{width:54px;height:52px;border-radius:16px;border:2px solid #fff;background:linear-gradient(145deg,#4da7ff,#3978f6);color:white;font-size:22px;font-weight:900;box-shadow:0 3px 7px #294aaa33}.key:nth-child(even){background:linear-gradient(145deg,var(--violet),var(--blue))}.key:disabled{opacity:.45}.clear{display:block;margin:10px auto 0;padding:8px 18px;border-radius:14px;border:1.5px solid var(--pink);background:#fff2f8;color:var(--ink);font-weight:800}
    .win{padding:28px 18px;text-align:center}.trophy{width:92px;height:92px;margin:auto;border-radius:50%;border:4px solid white;background:linear-gradient(145deg,var(--gold),#ff8a5c);display:grid;place-items:center;font-size:48px}.win h1{font-size:30px;margin:6px 0}.win .mission{margin-top:17px;color:var(--violet);font-size:12px;font-weight:900;letter-spacing:1.2px}.stars{font-size:38px;letter-spacing:5px;margin:18px 0 6px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}.action{height:52px;border-radius:17px;border:2px solid var(--blue);background:var(--blue);color:white;font-weight:900}.action.alt{background:white;color:var(--blue)}
    @media(max-width:360px){#app{padding-left:9px;padding-right:9px}.cell{width:46px;height:46px}.level{grid-template-columns:66px 1fr 42px}.badge{height:78px}.filter{font-size:10px}}
  </style>
</head>
<body><main id="app"></main>
<script>
(() => {
  const host = window.KiyavamaHost || {savedState:null};
  const send = (type, extra={}) => window.ReactNativeWebView?.postMessage(JSON.stringify({type,...extra}));
  const h=(id,r,c,a,b,z)=>[{row:r,col:c,type:a==='blank'?'blank':'number',value:a==='blank'?undefined:a,h:id},{row:r,col:c+1,type:'operator',value:'+',h:id},{row:r,col:c+2,type:'number',value:b,h:id},{row:r,col:c+3,type:'equals',value:'=',h:id},{row:r,col:c+4,type:'number',value:z,h:id}];
  const v=(id,r,c,a,b,z)=>[{row:r,col:c,type:a==='blank'?'blank':'number',value:a==='blank'?undefined:a,v:id},{row:r+1,col:c,type:'operator',value:'+',v:id},{row:r+2,col:c,type:'number',value:b,v:id},{row:r+3,col:c,type:'equals',value:'=',v:id},{row:r+4,col:c,type:'number',value:z,v:id}];
  const merge=groups=>{const m=new Map;groups.flat().forEach(c=>{const k=c.row+','+c.col,e=m.get(k);m.set(k,e?{...e,h:e.h||c.h,v:e.v||c.v,type:e.type==='blank'||c.type==='blank'?'blank':e.type,value:e.value??c.value}:{...c})});return [...m.values()]};
  const P=(id,title,difficulty,rows,cols,groups,solutions)=>({id,title,difficulty,rows,cols,cells:merge(groups),solutions});
  const puzzles=[
    P('easy-cross','First Cross','easy',5,5,[h('h1',0,0,'blank',1,4),v('v1',0,0,'blank',2,5)],{'0,0':3}),
    P('easy-plus','Plus Power','easy',5,5,[h('h1',2,0,'blank',1,4),v('v1',0,2,'blank',1,5),[{row:2,col:2,type:'number',value:1,h:'h1',v:'v1'}]],{'2,0':3,'0,2':4}),
    P('medium-double','Double Lines','medium',5,7,[h('h1',0,2,'blank',3,8),v('v1',0,2,'blank',2,7),h('h2',2,0,'blank',2,5)],{'0,2':5,'2,0':3}),
    P('easy-tiny-t','Tiny T','easy',5,8,[h('h1',0,1,'blank',3,7),v('v1',0,1,'blank',2,6),h('h2',2,3,'blank',1,5)],{'0,1':4,'2,3':4}),
    P('easy-lucky-seven','Lucky Seven','easy',10,5,[h('h1',0,0,'blank',3,10),v('v1',0,0,'blank',4,11),h('h2',5,0,'blank',1,8),v('v2',5,0,'blank',2,9)],{'0,0':7,'5,0':7}),
    P('medium-triple','Triple Treat','medium',5,15,[h('h1',0,0,'blank',4,9),v('v1',0,0,'blank',3,8),h('h2',0,5,'blank',5,11),v('v2',0,5,'blank',2,8),h('h3',0,10,'blank',3,7),v('v3',0,10,'blank',1,5)],{'0,0':5,'0,5':6,'0,10':4}),
    P('medium-t-trail','T-Trail','medium',5,7,[h('h1',0,1,'blank',3,8),v('v1',0,1,'blank',2,7),h('h2',2,2,'blank',3,8)],{'0,1':5,'2,2':5}),
    P('medium-cross-town','Cross Town','medium',5,20,[h('h1',0,0,'blank',5,9),v('v1',0,0,'blank',2,6),h('h2',0,5,'blank',6,11),v('v2',0,5,'blank',3,8),h('h3',0,10,'blank',4,7),v('v3',0,10,'blank',1,4),h('h4',0,15,'blank',5,11),v('v4',0,15,'blank',2,8)],{'0,0':4,'0,5':5,'0,10':3,'0,15':6}),
    P('hard-square-four','Square Four','hard',10,10,[h('h1',0,0,'blank',7,15),v('v1',0,0,'blank',5,13),h('h2',0,5,'blank',6,14),v('v2',0,5,'blank',4,12),h('h3',5,0,'blank',8,17),v('v3',5,0,'blank',6,15),h('h4',5,5,'blank',5,12),v('v4',5,5,'blank',3,10)],{'0,0':8,'0,5':8,'5,0':9,'5,5':7}),
    P('hard-super-six','Super Six','hard',30,5,[h('h1',0,0,'blank',7,15),v('v1',0,0,'blank',5,13),h('h2',5,0,'blank',8,17),v('v2',5,0,'blank',6,15),h('h3',10,0,'blank',6,13),v('v3',10,0,'blank',4,11),h('h4',15,0,'blank',9,19),v('v4',15,0,'blank',4,14),h('h5',20,0,'blank',5,11),v('v5',20,0,'blank',3,9),h('h6',25,0,'blank',7,15),v('v6',25,0,'blank',4,12)],{'0,0':8,'5,0':9,'10,0':7,'15,0':10,'20,0':6,'25,0':8})
  ];
  let state={view:'menu',filter:'all',active:null,selected:null,answers:{},mistakes:0,completed:[...(host.savedState?.completed||[])]};
  const app=document.querySelector('#app'); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const header=title=>`<div class="topbar"><button class="round" data-action="back">‹</button><button class="title-pill">${esc(title)}</button><button class="round close" data-action="close">×</button></div>`;
  function save(){send('save',{state:{completed:state.completed}})}
  function renderMenu(){const list=puzzles.filter(p=>state.filter==='all'||p.difficulty===state.filter);app.innerHTML=header('Math Crossword')+`<section class="panel hero"><div class="hero-row"><div class="icon">🔢</div><div><div class="eyebrow">NUMBER LAB</div><h1>Unlock every sum!</h1><p>Connect the clues and become a number hero.</p></div></div><div class="tip">💡 Fill the yellow squares so every row and column adds up!</div><div class="stats"><div class="stat"><b>▦ 10</b><small>Missions</small></div><div class="stat"><b>✦ 3</b><small>Difficulties</small></div><div class="stat"><b>★ ${state.completed.length}</b><small>Completed</small></div></div></section><div class="section-title"><h2>Choose a mission</h2><span>${list.length} shown</span></div><div class="filters">${[['all','✦ All'],['easy','🌱 Easy'],['medium','⭐ Medium'],['hard','🔥 Hard']].map(([k,l])=>`<button class="filter ${state.filter===k?'active':''}" data-filter="${k}">${l}</button>`).join('')}</div><section>${list.map(p=>{const i=puzzles.indexOf(p)+1,b=Object.keys(p.solutions).length,done=state.completed.includes(p.id);return `<button class="level" data-level="${p.id}"><span class="badge ${p.difficulty}"><i>${done?'✓':p.difficulty==='easy'?'🌱':p.difficulty==='medium'?'⭐':'🔥'}</i><b>LEVEL ${i}</b></span><span><h3>${esc(p.title)}</h3><span class="preview"><i class="blank">?</i><i>+</i><i>1</i><i>=</i><i>4</i></span><span class="meta">${p.difficulty[0].toUpperCase()+p.difficulty.slice(1)}　${b} blank${b===1?'':'s'}</span></span><span><span class="play-circle">▶</span><div class="play-label">PLAY</div></span></button>`}).join('')}</section>`;bind()}
  function activeClue(){if(!state.selected)return 'Tap a yellow blank to fill it in!';const c=state.active.cells.find(x=>x.row+','+x.col===state.selected),id=c?.h||c?.v,dir=c?.h?'h':'v';if(!id)return 'Choose a number';return state.active.cells.filter(x=>x[dir]===id).sort((a,b)=>dir==='h'?a.col-b.col:a.row-b.row).map(x=>x.type==='blank'?(state.answers[x.row+','+x.col]??'?'):x.value).join(' ')}
  function renderPlay(){const p=state.active,idx=puzzles.indexOf(p)+1,map=new Map(p.cells.map(c=>[c.row+','+c.col,c]));const rows=[];for(let r=0;r<p.rows;r++){for(let c=0;c<p.cols;c++){const k=r+','+c,x=map.get(k);if(!x)rows.push(`<span class="cell empty"></span>`);else{const ans=state.answers[k],val=x.type==='blank'?(ans??'?'):x.value;rows.push(`<button class="cell ${x.type==='blank'?'blank':''} ${state.selected===k?'selected':''}" ${x.type==='blank'?`data-cell="${k}"`:''}>${val}</button>`)}}}app.innerHTML=header(p.title)+`<div class="game-stats"><div class="game-stat">🚩 Level ${idx}</div><div class="game-stat">⭐ ${p.difficulty}</div><div class="game-stat">💗 ${state.mistakes} mistakes</div></div><section class="panel clue"><small>💡 ACTIVE CLUE</small><strong>${esc(activeClue())}</strong></section><section class="panel board-wrap"><div class="board" style="grid-template-columns:repeat(${p.cols},52px)">${rows.join('')}</div></section><section class="panel keypad"><div class="keypad-title">${state.selected?'CHOOSE A NUMBER':'SELECT A YELLOW SQUARE'}</div><div class="keys">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button class="key" data-digit="${n}" ${state.selected?'':'disabled'}>${n}</button>`).join('')}</div><button class="clear" data-action="clear">⌫ Clear cell</button></section>`;bind()}
  function renderWin(){const stars=state.mistakes===0?3:state.mistakes<=2?2:1;app.innerHTML=header('Math Crossword')+`<section class="panel win"><div class="trophy">🏆</div><div class="mission">MISSION COMPLETE</div><h1>Puzzle solved!</h1><p>${esc(state.active.title)}</p><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p>${state.mistakes===0?'Perfect — no mistakes!':state.mistakes+' mistakes'}</p><div class="actions"><button class="action" data-action="replay">Play again</button><button class="action alt" data-action="menu">More puzzles</button></div></section>`;bind()}
  function bind(){app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;renderMenu()});app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{state.active=puzzles.find(p=>p.id===b.dataset.level);state.view='play';state.answers={};state.mistakes=0;state.selected=null;renderPlay()});app.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.cell;renderPlay()});app.querySelectorAll('[data-digit]').forEach(b=>b.onclick=()=>pick(+b.dataset.digit));app.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action))}
  function pick(n){if(!state.selected)return;const good=state.active.solutions[state.selected]===n;state.answers[state.selected]=n;if(!good){state.mistakes++;navigator.vibrate?.(35);renderPlay();return}const done=Object.entries(state.active.solutions).every(([k,v])=>state.answers[k]===v);if(done){if(!state.completed.includes(state.active.id))state.completed.push(state.active.id);save();send('completed',{text:state.active.title+' completed!'});state.view='win';renderWin()}else renderPlay()}
  function action(a){if(a==='close')return send('close');if(a==='back'){if(state.view==='menu')return send('back');state.view='menu';return renderMenu()}if(a==='clear'&&state.selected){delete state.answers[state.selected];return renderPlay()}if(a==='replay'){state.answers={};state.mistakes=0;state.selected=null;state.view='play';return renderPlay()}if(a==='menu'){state.view='menu';return renderMenu()}}
  renderMenu();
})();
</script></body></html>
