#game-startup:before{inset:-28px;z-index:-2;background-size:cover;filter:blur(22px);transform:scale(1.06)}
#game-startup:after{inset:0;z-index:-1;background-size:cover}
.startup-live{position:absolute;top:38.1%;left:50%;width:min(92vw,430px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.loader-orbit{position:relative;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:rgba(191,239,255,.5);box-shadow:inset 0 0 0 8px rgba(223,248,255,.84),0 9px 20px rgba(7,108,163,.17)}
.loader-orbit:before{content:"";position:absolute;inset:0;border:9px solid transparent;border-top-color:#169ff0;border-right-color:#169ff0;border-bottom-color:#43c8f5;border-radius:50%;animation:game-spin 1.05s linear infinite}.loader-star{width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(187,123,0,.2));animation:star-bob 1.2s ease-in-out infinite}
.startup-copy{margin-top:24px;text-shadow:0 2px 0 rgba(255,255,255,.38)}.startup-copy h1{font-size:clamp(27px,7vw,38px);line-height:1.06;margin:0;color:#082459;letter-spacing:.1px}.startup-copy p{font-family:"Trebuchet MS",Arial,sans-serif;font-size:clamp(17px,4.5vw,22px);margin:10px 0 0;color:#4a78a6;font-weight:500}
#game-startup-back{margin-top:27px;min-width:min(76vw,360px);height:76px;padding:0 26px;border:0;border-radius:38px;background:linear-gradient(180deg,#2ebcff,#0879ed);box-shadow:0 8px 0 #075bc2,0 15px 23px rgba(0,94,167,.28),inset 0 2px 0 rgba(255,255,255,.35);color:#fff;font-family:KiyavamaPlay,"Arial Rounded MT Bold",sans-serif;font-size:clamp(21px,5.7vw,29px);font-weight:800;cursor:pointer;text-shadow:0 3px 0 rgba(0,74,151,.32);display:inline-flex;align-items:center;justify-content:center;gap:15px;transition:transform .12s ease,box-shadow .12s ease}#game-startup-back img{width:46px;height:46px;object-fit:contain}#game-startup-back:active{transform:translateY(4px);box-shadow:0 4px 0 #075bc2,0 8px 14px rgba(0,94,167,.24),inset 0 2px 0 rgba(255,255,255,.35)}
.beach-note{position:absolute;bottom:6.8%;left:50%;transform:translateX(-50%);width:88%;font-family:"Trebuchet MS",Arial,sans-serif;font-size:clamp(17px,4.5vw,24px);font-weight:500;color:#356a91;text-shadow:0 2px 0 rgba(255,255,255,.62)}.beach-note span{display:block;margin-top:5px;color:#1577cf;font-family:KiyavamaPlay,sans-serif;font-size:36px;line-height:.8}
#game-startup-slow{position:absolute;left:50%;top:72%;transform:translateX(-50%);width:min(88%,360px);padding:12px;border-radius:18px;background:rgba(255,255,255,.95);box-shadow:0 10px 26px rgba(20,82,120,.2);color:#244d6a;font-family:"Trebuchet MS",Arial,sans-serif;font-size:14px}#game-startup-slow button{margin-left:8px;padding:8px 12px;border:0;border-radius:12px;background:#087ce8;color:#fff;font-weight:800;cursor:pointer}
[hidden]{display:none!important}@keyframes game-spin{to{transform:rotate(360deg)}}@keyframes star-bob{50%{transform:translateY(-4px) scale(1.06)}}@media(min-aspect-ratio:3/5){#game-startup:after{left:50%;right:auto;width:min(100%,47.34vh);transform:translateX(-50%);background-size:contain;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%)}}@media(max-height:700px){.startup-live{top:35%}.loader-orbit{width:70px;height:70px}.loader-star{width:46px;height:46px}.startup-copy{margin-top:13px}.startup-copy h1{font-size:24px}.startup-copy p{margin-top:5px;font-size:15px}#game-startup-back{margin-top:15px;height:58px;min-width:min(70vw,320px);font-size:20px}#game-startup-back img{width:36px;height:36px}.beach-note{bottom:4%;font-size:15px}.beach-note span{font-size:27px}}@media(prefers-reduced-motion:reduce){.loader-orbit:before,.loader-star{animation:none}}
</style>
