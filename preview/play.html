<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0c6e99" />
  <title>Game Preview • Kiyavama</title>
  <style>
    :root{font-family:Inter,ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15334a;background:#dff6ff}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{background:linear-gradient(180deg,#6bd4ff,#e9fbff)}
    .shell{display:flex;width:100%;height:100%;flex-direction:column}
    .topbar{position:relative;z-index:10;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;min-height:64px;padding:max(env(safe-area-inset-top),8px) 12px 8px;background:rgba(255,255,255,.96);border-bottom:1px solid #d9eef6;box-shadow:0 4px 18px rgba(18,94,126,.12)}
    .back,.full{display:inline-flex;height:44px;align-items:center;justify-content:center;gap:7px;border:0;border-radius:14px;padding:0 14px;background:#e8f6fb;color:#145774;font-weight:950;cursor:pointer}
    .back:active,.full:active{transform:scale(.97)}
    .full{background:#1388b8;color:#fff}
    .copy{min-width:0;text-align:center}
    .copy strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
    .copy span{display:block;margin-top:2px;color:#71909f;font-size:11px;font-weight:850}
    .stage{position:relative;min-height:0;flex:1;background:#edfaff}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .loading,.error{position:absolute;z-index:4;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#7cdcff,#dff8ff 60%,#f5df9c)}
    .loading-card,.error-card{width:min(420px,92vw);padding:24px;border:3px solid rgba(255,255,255,.92);border-radius:28px;background:rgba(255,255,255,.95);box-shadow:0 18px 38px rgba(16,92,124,.18);text-align:center}
    .mascot{font-size:54px;animation:bob 1.3s ease-in-out infinite}
    .loading-card h1,.error-card h1{margin:10px 0 6px;font-size:22px;color:#0d6287}
    .loading-card p,.error-card p{margin:0;color:#638190;font-weight:750;line-height:1.45}
    .spinner{width:42px;height:42px;margin:18px auto 0;border:6px solid #d9f2fb;border-top-color:#148bb9;border-radius:50%;animation:spin .8s linear infinite}
    .error{display:none}
    .error button{margin-top:16px;border:0;border-radius:14px;padding:12px 18px;background:#148bb9;color:#fff;font-weight:950;cursor:pointer}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bob{50%{transform:translateY(-7px)}}
    @media(max-width:600px){.topbar{min-height:58px;padding-left:8px;padding-right:8px}.back,.full{height:40px;padding:0 11px;font-size:12px}.copy strong{font-size:13px}.copy span{font-size:10px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <button class="back" id="back" type="button">← Games</button>
      <div class="copy">
        <strong id="title">Loading game…</strong>
        <span id="version">Kiyavama preview</span>
      </div>
      <button class="full" id="fullscreen" type="button">⛶ Fullscreen</button>
    </header>

    <section class="stage" id="stage">
      <iframe id="game-frame" title="Kiyavama game preview" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" allowfullscreen></iframe>
      <div class="loading" id="loading">
        <div class="loading-card">
          <div class="mascot">⭐</div>
          <h1>Getting your game ready…</h1>
          <p>Loading the latest GitHub version for browser preview.</p>
          <div class="spinner"></div>
        </div>
      </div>
      <div class="error" id="error">
        <div class="error-card">
          <div class="mascot">🛟</div>
          <h1>Preview could not open</h1>
          <p id="error-message">Please try again.</p>
          <button type="button" onclick="location.reload()">Try again</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const gameId = params.get("game") || "";
    const frame = document.getElementById("game-frame");
    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error");
    const errorMessage = document.getElementById("error-message");
    const titleNode = document.getElementById("title");
    const versionNode = document.getElementById("version");
    const stage = document.getElementById("stage");

    const createdUrls = [];
    const MANIFEST_CATALOG = "../game-packs/catalog.json";

    function prettyTitle(id) {
      const special = {
        kiyavama_play: "Bunny's Play Garden",
        mouse_maze_adventure: "Mouse Maze Adventure",
        math_crossword: "Math Crossword",
        thaana_crush: "Thaana Crush",
        tic_tac_toe: "Tic-Tac-Toe",
        connect4: "Connect Four",
        a_to_z_words: "A to Z Words"
      };
      if (special[id]) return special[id];
      return id.split("_").map(part => part ? part[0].toUpperCase() + part.slice(1) : "").join(" ");
    }

    function cleanPath(path) {
      return decodeURIComponent(String(path || "").replace(/^\.\//, "").replace(/^\//, ""));
    }

    function resolvePackPath(baseFile, ref) {
      const raw = String(ref || "").trim();
      if (!raw || /^(?:data:|blob:|https?:|javascript:|mailto:|tel:|#)/i.test(raw)) return null;
      try {
        const base = new URL("https://preview.invalid/" + cleanPath(baseFile));
        const resolved = new URL(raw, base);
        return cleanPath(resolved.pathname);
      } catch {
        return null;
      }
    }

    function rewriteCssUrls(css, baseFile, fileMap) {
      return css.replace(/url\(([^)]+)\)/gi, (whole, rawValue) => {
        const trimmed = rawValue.trim();
        const quote = (trimmed[0] === '"' || trimmed[0] === "'") ? trimmed[0] : "";
        const ref = quote ? trimmed.slice(1, -1) : trimmed;
        const packPath = resolvePackPath(baseFile, ref);
        const replacement = packPath ? fileMap.get(packPath) : null;
        return replacement ? 'url("' + replacement + '")' : whole;
      });
    }

    async function buildRuntime(manifest) {
      const files = Array.isArray(manifest.files) ? manifest.files : [];
      const fileMap = new Map();
      for (const file of files) {
        if (file && file.path && file.url) fileMap.set(cleanPath(file.path), file.url);
      }

      // CSS normally contains relative image URLs. Rebuild each stylesheet as
      // a blob with those URLs pointed at the checksum-addressed GitHub objects.
      const cssRuntimeMap = new Map();
      for (const file of files) {
        if (!file?.path || !file?.url || !/\.css$/i.test(file.path)) continue;
        const response = await fetch(file.url, { cache: "force-cache" });
        if (!response.ok) throw new Error("Could not load stylesheet " + file.path);
        const css = rewriteCssUrls(await response.text(), file.path, fileMap);
        const blobUrl = URL.createObjectURL(new Blob([css], { type: "text/css" }));
        createdUrls.push(blobUrl);
        cssRuntimeMap.set(cleanPath(file.path), blobUrl);
      }

      const entryFile = cleanPath(manifest?.content?.runtime?.entryFile || "index.html");
      const entry = files.find(file => cleanPath(file.path) === entryFile);
      if (!entry?.url) throw new Error("This game does not have a browser entry file.");

      const htmlResponse = await fetch(entry.url, { cache: "force-cache" });
      if (!htmlResponse.ok) throw new Error("Could not load the game entry page.");
      const htmlText = await htmlResponse.text();
      const doc = new DOMParser().parseFromString(htmlText, "text/html");

      for (const element of doc.querySelectorAll("[src],[href],[poster]")) {
        for (const attr of ["src", "href", "poster"]) {
          if (!element.hasAttribute(attr)) continue;
          const ref = element.getAttribute(attr);
          const packPath = resolvePackPath(entryFile, ref);
          if (!packPath) continue;
          const replacement = cssRuntimeMap.get(packPath) || fileMap.get(packPath);
          if (replacement) element.setAttribute(attr, replacement);
        }
      }

      for (const element of doc.querySelectorAll("[style]")) {
        element.setAttribute("style", rewriteCssUrls(element.getAttribute("style") || "", entryFile, fileMap));
      }
      for (const style of doc.querySelectorAll("style")) {
        style.textContent = rewriteCssUrls(style.textContent || "", entryFile, fileMap);
      }

      // The mobile games already understand ReactNativeWebView messages.
      // Forward those messages to the preview shell so Back to Games works.
      const bridge = doc.createElement("script");
      bridge.textContent =
        "window.ReactNativeWebView={postMessage:function(value){try{parent.postMessage({__kiyavamaPreview:true,value:value},'*')}catch(e){}}};" +
        "window.__KIYAVAMA_BROWSER_PREVIEW__=true;";
      (doc.head || doc.documentElement).prepend(bridge);

      return "<!doctype html>\n" + doc.documentElement.outerHTML;
    }

    async function openGame() {
      if (!gameId) throw new Error("No game was selected.");
      titleNode.textContent = prettyTitle(gameId);

      const catalogResponse = await fetch(MANIFEST_CATALOG + "?preview=" + Date.now(), { cache: "no-store" });
      if (!catalogResponse.ok) throw new Error("Game catalog returned " + catalogResponse.status + ".");
      const catalog = await catalogResponse.json();
      const descriptor = catalog?.packs?.[gameId];
      if (!descriptor?.manifestUrl) throw new Error("This game is not in the GitHub preview catalog.");

      versionNode.textContent = "Version " + descriptor.version + " • GitHub preview";

      const manifestResponse = await fetch(descriptor.manifestUrl + "?preview=" + Date.now(), { cache: "no-store" });
      if (!manifestResponse.ok) throw new Error("Game manifest returned " + manifestResponse.status + ".");
      const manifest = await manifestResponse.json();

      const runtimeHtml = await buildRuntime(manifest);
      frame.onload = () => {
        loading.style.display = "none";
      };
      frame.srcdoc = runtimeHtml;

      // Safety fallback: do not leave the loading cover up forever if a game
      // intentionally keeps the document loading state busy.
      setTimeout(() => {
        loading.style.display = "none";
      }, 7000);
    }

    function showError(error) {
      console.error(error);
      loading.style.display = "none";
      errorMessage.textContent = error instanceof Error ? error.message : String(error);
      errorBox.style.display = "flex";
    }

    document.getElementById("back").addEventListener("click", () => {
      location.href = "./";
    });

    document.getElementById("fullscreen").addEventListener("click", async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await stage.requestFullscreen();
        }
      } catch {
        try { await frame.requestFullscreen(); } catch {}
      }
    });

    window.addEventListener("message", event => {
      if (event.source !== frame.contentWindow) return;
      const data = event.data;
      if (!data || data.__kiyavamaPreview !== true) return;
      let payload = data.value;
      if (typeof payload === "string") {
        try { payload = JSON.parse(payload); } catch {}
      }
      if (payload?.type === "close" || payload?.type === "back") {
        location.href = "./";
      }
    });

    window.addEventListener("beforeunload", () => {
      for (const url of createdUrls) URL.revokeObjectURL(url);
    });

    openGame().catch(showError);
  </script>
</body>
</html>
