          06	https://sdmntprwestus3.oaiusercontent.com/files/00000000-1e1c-81fd-9795-77bde6acb538/raw?se=2026-09-19T17%3A40%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=d3ed4457-631e-5d9c-80d2-32b3582a9db9&skoid=b7fc319f-b93c-4fac-ba5f-14fdc3f9209f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T02%3A04%3A09Z&ske=2026-09-20T02%3A04%3A09Z&sks=b&skv=2026-02-06&sig=jhn%2BhR711LW7dYUfiFLW96lhCBwhfrXJtA9x8K4Y9qs%3D
          07	https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-a6e8-81fa-8add-f1431b7c84c8/raw?se=2026-09-19T17%3A41%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=e89e7d7f-66c1-5b94-9178-ec113323ffe1&skoid=b7fc319f-b93c-4fac-ba5f-14fdc3f9209f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T04%3A41%3A11Z&ske=2026-09-20T04%3A41%3A11Z&sks=b&skv=2026-02-06&sig=1ow%2BYdpu2ThM4iRMGyfzEwokKRzPB7omd85O6VvTCkg%3D
          08	https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-f0a0-81fb-b967-b230595f71c1/raw?se=2026-09-19T17%3A41%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=eb730f06-8ec9-5637-885b-087872bb7ae7&skoid=b7fc319f-b93c-4fac-ba5f-14fdc3f9209f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T05%3A07%3A23Z&ske=2026-09-20T05%3A07%3A23Z&sks=b&skv=2026-02-06&sig=kKFNVNJpkLZPl8WS9uL4ITc7f4Bhn871jrQpQknEePI%3D
          09	https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-0a90-81fa-93ad-4709df7fdfd2/raw?se=2026-09-19T17%3A41%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=eee0bd8a-a054-55d7-9f6a-25f993f611a7&skoid=b7fc319f-b93c-4fac-ba5f-14fdc3f9209f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T06%3A06%3A41Z&ske=2026-09-20T06%3A06%3A41Z&sks=b&skv=2026-02-06&sig=YNMCNE9kAsT5x5D6BTuMoGIL6Yu1V9hFY0HEPOV/6TE%3D
          10	https://sdmntprcentralus.oaiusercontent.com/files/00000000-7c14-81f5-9cc8-e059f52c38fc/raw?se=2026-09-19T17%3A41%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=497a3de8-354a-5c33-9b1f-4d4f0d46b730&skoid=b7fc319f-b93c-4fac-ba5f-14fdc3f9209f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T03%3A48%3A01Z&ske=2026-09-20T03%3A48%3A01Z&sks=b&skv=2026-02-06&sig=qujcPt4T86o6ddcJo/B7VjC3lqARtl3l4W7qTsZ0/q0%3D
          11	https://sdmntprcentralus.oaiusercontent.com/files/00000000-cf3c-81f5-8cac-0a2b32da99fc/raw?se=2026-09-19T17%3A41%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=f88bc2b1-9160-5dba-b725-a5b29d4b2046&skoid=b7fc319f-b93c-4fac-ba5f-14fdc3f9209f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T02%3A05%3A08Z&ske=2026-09-20T02%3A05%3A08Z&sks=b&skv=2026-02-06&sig=pJUm5AL76GtLsoLYSqVtyUwVO%2BkWIHwxRT7zHWR/jc8%3D
          12	https://sdmntprwestus3.oaiusercontent.com/files/00000000-a0d4-81fd-b018-b122a3112ec2/raw?se=2026-09-19T17%3A41%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=70e8f028-3685-5846-aeeb-8e733d88cfd0&skoid=b7fc319f-b93c-4fac-ba5f-14fdc3f9209f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T06%3A07%3A31Z&ske=2026-09-20T06%3A07%3A31Z&sks=b&skv=2026-02-06&sig=ZLT2tMOSZCQ6egPycCh4G%2BzjB%2B3ST8hFYOtzPJvoZdo%3D
          13	https://sdmntprcentralus.oaiusercontent.com/files/00000000-fe00-81f5-af73-45e7b76dd953/raw?se=2026-09-19T17%3A41%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=1df0bdc9-5360-5e05-9bc9-07bd685b49b9&skoid=b7fc319f-b93c-4fac-ba5f-14fdc3f9209f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T02%3A16%3A47Z&ske=2026-09-20T02%3A16%3A47Z&sks=b&skv=2026-02-06&sig=ry/dQkqQrWTdLbl4CGOGkH0zmmtEFS4ZqKw9KuqRmLM%3D
          EOF
          download_one() {
            local n="$1" url="$2"
            curl -fL --retry 4 --retry-delay 1 --connect-timeout 20 --max-time 180 "$url" -o "/tmp/kiyavama-transfer/zips/part-${n}.zip"
            unzip -p "/tmp/kiyavama-transfer/zips/part-${n}.zip" "site.part-${n}" > "/tmp/kiyavama-transfer/parts/site.part-${n}"
          }
          export -f download_one
          awk -F '\t' '{print $1 "\t" $2}' /tmp/kiyavama-transfer/urls.tsv | xargs -P 7 -n 2 bash -c 'download_one "$0" "$1"'
          cat /tmp/kiyavama-transfer/parts/site.part-* > /tmp/kiyavama-transfer/site.tar.gz
          gzip -t /tmp/kiyavama-transfer/site.tar.gz

      - name: Rebuild public distribution tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public-site
          mkdir -p public-site
          tar -xzf /tmp/kiyavama-transfer/site.tar.gz -C public-site
          python3 - <<'PY'
          from pathlib import Path
          old = b"https://certainity.github.io/kiyavama-games"
          new = b"https://certainity.github.io/kiyavama-game-packs"
          allowed = {".json",".html",".js",".css",".txt",".md",".xml",".webmanifest"}
          changed = 0
          for p in Path("public-site").rglob("*"):
              if not p.is_file() or p.suffix.lower() not in allowed:
                  continue
              data = p.read_bytes()
              if old in data:
                  p.write_bytes(data.replace(old,new))
                  changed += 1
          print(f"Rewrote old Pages base in {changed} files")
          PY
          node - <<'NODE'
          const fs = require('fs');
          const p = 'public-site/game-packs/catalog.json';
          const c = JSON.parse(fs.readFileSync(p,'utf8'));
          const ids = Object.keys(c.packs || {});
          if (ids.length !== 83) throw new Error('Expected 83 packs, got ' + ids.length);
          for (const [id, pack] of Object.entries(c.packs)) {
            if (!String(pack.manifestUrl || '').startsWith('https://certainity.github.io/kiyavama-game-packs/')) {
              throw new Error(id + ' still has wrong manifest host');
            }
          }
          console.log('PASS: 83 game packs point to public distribution repo');
          NODE
          test -f public-site/preview/index.html
          test -f public-site/preview/play.html
          touch public-site/.nojekyll

      - name: Publish distribution branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/kiyavama-public-site
          mkdir -p /tmp/kiyavama-public-site
          cp -a public-site/. /tmp/kiyavama-public-site/
          git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          cp -a /tmp/kiyavama-public-site/. .
          git add -A
          git commit -m "Publish 83 Kiyavama game packs and preview hub"
          git push --force origin HEAD:gh-pages
