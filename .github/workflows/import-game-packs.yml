name: Import Kiyavama game packs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-game-packs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out distribution repo
        uses: actions/checkout@v4

      - name: Download transfer chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kiyavama-transfer/zips /tmp/kiyavama-transfer/parts
          cat > /tmp/kiyavama-transfer/urls.tsv <<'EOF'
